name: Linux

on:
  workflow_dispatch:
    inputs:
      commands:
        description: "Lenh Linux muon chay"
        required: false
        default: "uname -a"

permissions: {}

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Don o dia (go cac bo cong cu cai san)
        run: |
          echo "Truoc khi don:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Sau khi don:"; df -h /
      - name: Thong tin he thong
        run: |
          cat /etc/os-release
          uname -a
          echo "CPU: $(nproc) vCPU"
          free -h
          df -h /
      - name: Chay lenh cua ban
        env:
          CMDS: ${{ inputs.commands }}
        run: bash -c "$CMDS"
